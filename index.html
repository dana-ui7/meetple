<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>meetple · 함께 만나는 사람들</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="#" class="logo">meet<span>ple</span></a>
      <nav class="nav">
        <a href="#meetups">모임 찾기</a>
        <a href="#features">소개</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>관심사가 같은 사람들과<br>지금 바로 만나보세요</h1>
        <p>meetple에서 동네 모임, 스터디, 취미 활동을 찾고 직접 만들어 보세요.</p>
        <a href="#meetups" class="btn">모임 둘러보기</a>
      </div>
    </section>

    <section id="features" class="features container">
      <div class="feature">
        <div class="feature__icon">🔍</div>
        <h3>쉽게 찾기</h3>
        <p>카테고리와 키워드로 원하는 모임을 빠르게 찾을 수 있어요.</p>
      </div>
      <div class="feature">
        <div class="feature__icon">🤝</div>
        <h3>함께 참여</h3>
        <p>버튼 한 번으로 모임에 참여하고 새로운 사람을 만나요.</p>
      </div>
      <div class="feature">
        <div class="feature__icon">✨</div>
        <h3>직접 만들기</h3>
        <p>원하는 모임이 없다면 직접 열어 사람들을 모아보세요.</p>
      </div>
    </section>

    <section id="meetups" class="meetups container">
      <h2>모임 둘러보기</h2>
      <div class="toolbar">
        <input type="search" id="search" placeholder="모임 이름으로 검색">
        <div class="chips" id="categories"></div>
      </div>
      <div class="grid" id="meetup-list"></div>
      <p class="empty" id="empty" hidden>조건에 맞는 모임이 없어요.</p>
    </section>
  </main>

  <footer class="footer">
    <div class="container">© 2026 meetple</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
